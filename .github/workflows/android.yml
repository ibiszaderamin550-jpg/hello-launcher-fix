name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0

      - name: set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
    - name: Fix bottom-bar dependency
      run: |
        mkdir -p ~/.m2/repository/com/roughike/bottom-bar/2.3.1
        curl -L -o ~/.m2/repository/com/roughike/bottom-bar/2.3.1/bottom-bar-2.3.1.aar "https://jcenter.bintray.com/com/roughike/bottom-bar/2.3.1/bottom-bar-2.3.1.aar"
        curl -L -o ~/.m2/repository/com/roughike/bottom-bar/2.3.1/bottom-bar-2.3.1.pom "https://jcenter.bintray.com/com/roughike/bottom-bar/2.3.1/bottom-bar-2.3.1.pom"

    - name: Download JRE21 and JRE25
      run: |
        BASE="https://github.com/ibiszaderamin550-jpg/hello-launcher-fix/releases/download/jre-assets"
        mkdir -p HMCLPE/src/main/assets/app_runtime/java/JRE21
        mkdir -p HMCLPE/src/main/assets/app_runtime/java/JRE25
        curl -L -o jre21-arm64.tar.xz "$BASE/jre21-bin-arm64.tar.xz"
        curl -L -o jre21-universal.tar.xz "$BASE/jre21-universal.tar.xz"
        curl -L -o jre25-arm64.tar.xz "$BASE/jre25-bin-arm64.tar.xz"
        curl -L -o jre25-universal.tar.xz "$BASE/jre25-universal.tar.xz"
        cd HMCLPE/src/main/assets/app_runtime/java/JRE21
        tar -xf $GITHUB_WORKSPACE/jre21-arm64.tar.xz
        tar -xf $GITHUB_WORKSPACE/jre21-universal.tar.xz
        cd $GITHUB_WORKSPACE/HMCLPE/src/main/assets/app_runtime/java/JRE25
        tar -xf $GITHUB_WORKSPACE/jre25-arm64.tar.xz
        tar -xf $GITHUB_WORKSPACE/jre25-universal.tar.xz

    - name: Build apk
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon -x lint -x lintVitalRelease

    - name: Upload apk
      uses: actions/upload-artifact@v4
      with:
        name: HYPER-Launcher
        path: HMCLPE/build/outputs/apk/release/*
