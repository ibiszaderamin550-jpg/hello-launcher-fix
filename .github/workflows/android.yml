name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: set up JDK 11
      uses: actions/setup-java@v1
      with:
        java-version: 11

    - name: Download and extract JRE21 and JRE25
      run: |
        BASE="https://github.com/ibiszaderamin550-jpg/hello-launcher-fix/releases/download/jre-assets"
        mkdir -p HMCLPE/src/main/assets/app_runtime/java/JRE21
        mkdir -p HMCLPE/src/main/assets/app_runtime/java/JRE25
        curl -L -o jre21-arm64.tar.xz "$BASE/jre21-bin-arm64.tar.xz"
        curl -L -o jre21-universal.tar.xz "$BASE/jre21-universal.tar.xz"
        curl -L -o jre25-arm64.tar.xz "$BASE/jre25-bin-arm64.tar.xz"
        curl -L -o jre25-universal.tar.xz "$BASE/jre25-universal.tar.xz"
        cd HMCLPE/src/main/assets/app_runtime/java/JRE21
        tar -xf $GITHUB_WORKSPACE/jre21-arm64.tar.xz
        tar -xf $GITHUB_WORKSPACE/jre21-universal.tar.xz
        cd $GITHUB_WORKSPACE/HMCLPE/src/main/assets/app_runtime/java/JRE25
        tar -xf $GITHUB_WORKSPACE/jre25-arm64.tar.xz
        tar -xf $GITHUB_WORKSPACE/jre25-universal.tar.xz

    - name: Build apk
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Upload apk
      uses: actions/upload-artifact@v4
      with:
        name: HYPER-Launcher
        path: HMCLPE/build/outputs/apk/release/*
